<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesaj Cevapla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-indigo-100 to-red-200 -z-10"></div>

  <div class="absolute top-10 left-6">
    <button 
      onclick="window.history.back()" 
      class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg shadow"
    >
      ← Geri
    </button>
  </div>

  <div class="bg-white rounded shadow p-6 max-w-md w-full z-10">
    <h2 class="text-2xl font-semibold mb-4">📩 {{ receiver.username }} kullanıcısına mesaj gönder</h2>
    
    <form method="POST" action="">
      {% csrf_token %}
      <textarea
        name="content"
        rows="5"
        placeholder="Mesajınızı yazın..."
        class="w-full p-3 border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
        required
      ></textarea>
      
      <button
        type="submit"
        class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition"
      >
        Gönder
      </button>
    </form>
    
    <a href="{% url 'inbox' %}" class="inline-block mt-4 text-indigo-600 hover:underline">Gelen Kutusuna Dön</a>
  </div>

</body>
</html>
