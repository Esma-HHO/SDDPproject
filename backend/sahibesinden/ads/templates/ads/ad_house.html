<script src="https://cdn.tailwindcss.com"></script>
<div class="max-w-2xl mx-auto mt-10 p-8 bg-gradient-to-br from-green-100 via-blue-100 to-purple-100 rounded-3xl shadow-xl">
  <h2 class="text-3xl font-extrabold text-center text-blue-700 mb-6">🏡 Ev İlanı Ekle</h2>
  
  <form method="post" class="space-y-5">
    {% csrf_token %}
    
    <!-- Name -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">İlan Başlığı</label>
      <input type="text" name="name" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Price -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Fiyat</label>
      <input type="number" name="price" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Comments -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Açıklamalar</label>
      <textarea name="comments" rows="4" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
    </div>

    <!-- Bargaining -->
    <div class="flex items-center">
      <input type="checkbox" name="bargaining" class="mr-2 accent-blue-600">
      <label class="text-blue-700 font-semibold">Pazarlık Yapılabilir mi?</label>
    </div>

    <!-- Location -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Lokasyon</label>
      <input type="text" name="location" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Rooms -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Oda Sayısı</label>
      <input type="number" name="rooms" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Size m2 -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Metrekare</label>
      <input type="number" name="size_m2" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Floor -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Bulunduğu Kat</label>
      <input type="number" name="floor" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- BuildYear -->
    <div>
      <label class="block text-blue-700 font-semibold mb-1">Bina Yaşı</label>
      <input type="number" name="buildYear" class="w-full px-4 py-2 border border-blue-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full py-3 px-6 bg-gradient-to-r from-blue-500 to-teal-400 text-white text-lg font-bold rounded-xl shadow-md hover:from-blue-600 hover:to-teal-500 transition duration-300 transform hover:scale-105">
      🏠 İlanı Yayınla
    </button>
  </form>
</div>
